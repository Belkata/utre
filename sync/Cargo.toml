[package]
name = "utre-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.105"
getrandom = "0.4"
libc = "0.2"
iroh = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
utre-api = { path = "../api" }
utre-core = { path = "../core" }
